name: Snoozy
options:
  bundleIdPrefix: com.snoozy
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "3.4.0"
    CURRENT_PROJECT_VERSION: "18"
    TARGETED_DEVICE_FAMILY: "1"
    SUPPORTS_MACCATALYST: NO
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO

targets:
  Snoozy:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Snoozy
        excludes:
          - "**/*.md"
      - path: Snoozy/Resources/Assets.xcassets
    info:
      path: Snoozy/Info.plist
      properties:
        CFBundleDisplayName: Snoozy
        CFBundleShortVersionString: "3.4.0"
        CFBundleVersion: "18"
        CFBundleIcons:
          CFBundlePrimaryIcon:
            CFBundleIconFiles:
              - AppIcon60x60
            CFBundleIconName: AppIcon
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: ""
          UIImageName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIBackgroundModes:
          - audio
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UISupportsDocumentBrowser: false
        UIAppFonts:
          - atkinson_hyperlegible_400.ttf
          - atkinson_hyperlegible_700.ttf
          - bricolage_grotesque_500.ttf
          - bricolage_grotesque_600.ttf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.snoozy.app
        PRODUCT_NAME: Snoozy
        INFOPLIST_FILE: Snoozy/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
        MTL_ENABLE_DEBUG_INFO: NO
        MTL_FAST_MATH: YES

  SnoozyTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: SnoozyTests
    dependencies:
      - target: Snoozy
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Snoozy:
    build:
      targets:
        Snoozy: all
        SnoozyTests: [test]
    test:
      targets:
        - SnoozyTests
