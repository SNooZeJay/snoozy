name: Build Snoozy iOS IPA for Sideloadly

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish the built IPA to the v3.4.0 GitHub Release"
        type: boolean
        default: true
  push:
    branches:
      - main
      - master
      - "release/**"

permissions:
  contents: write

jobs:
  build-unsigned-ipa:
    name: Build Unsigned Snoozy.ipa (iPhone 13 mini / arm64)
    runs-on: macos-26
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi

      - name: Generate Xcode project
        working-directory: ios-native
        run: xcodegen generate

      - name: Build unsigned Release .app for iOS (arm64)
        working-directory: ios-native
        run: |
          set -o pipefail
          mkdir -p build
          if ! xcodebuild \
            -project Snoozy.xcodeproj \
            -scheme Snoozy \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            clean build 2>&1 | tee build/xcodebuild.log; then
            echo "=== XCODEBUILD ERRORS ==="
            grep -E "error:|fatal error:" build/xcodebuild.log | head -n 40 | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit 1
          fi

      - name: Package Payload into Snoozy-iOS-Sideloadly.ipa
        working-directory: ios-native
        run: |
          mkdir -p build/ipa/Payload
          cp -R build/DerivedData/Build/Products/Release-iphoneos/Snoozy.app build/ipa/Payload/Snoozy.app
          xcrun actool Snoozy/Resources/Assets.xcassets \
            --compile build/ipa/Payload/Snoozy.app \
            --platform iphoneos \
            --target-device iphone \
            --minimum-deployment-target 17.0 \
            --app-icon AppIcon \
            --output-partial-info-plist build/assetcatalog_generated_info.plist \
            --output-format human-readable-text
          cp -f Snoozy/Resources/SnoozyBrandLogo.png build/ipa/Payload/Snoozy.app/SnoozyBrandLogo.png
          cp -f Snoozy/Resources/Assets.xcassets/SnoozyIconLayer0.imageset/SnoozyIconLayer0@3x.png build/ipa/Payload/Snoozy.app/SnoozyIconLayer0@3x.png
          cp -f Snoozy/Resources/Assets.xcassets/SnoozyIconLayer1.imageset/SnoozyIconLayer1@3x.png build/ipa/Payload/Snoozy.app/SnoozyIconLayer1@3x.png
          cp -f Snoozy/Resources/Assets.xcassets/SnoozyIconLayer2.imageset/SnoozyIconLayer2@3x.png build/ipa/Payload/Snoozy.app/SnoozyIconLayer2@3x.png
          cp -f Snoozy/Resources/Assets.xcassets/SnoozyIconLayer3.imageset/SnoozyIconLayer3@3x.png build/ipa/Payload/Snoozy.app/SnoozyIconLayer3@3x.png
          cp -f Snoozy/Resources/Assets.xcassets/AppIcon.appiconset/AppIcon-60@2x.png build/ipa/Payload/Snoozy.app/AppIcon60x60@2x.png
          cp -f Snoozy/Resources/Assets.xcassets/AppIcon.appiconset/AppIcon-60@3x.png build/ipa/Payload/Snoozy.app/AppIcon60x60@3x.png
          cp -f Snoozy/Resources/Assets.xcassets/AppIcon.appiconset/AppIcon-40@2x.png build/ipa/Payload/Snoozy.app/AppIcon40x40@2x.png
          cp -f Snoozy/Resources/Assets.xcassets/AppIcon.appiconset/AppIcon-40@3x.png build/ipa/Payload/Snoozy.app/AppIcon40x40@3x.png
          cp -f Snoozy/Resources/Assets.xcassets/AppIcon.appiconset/AppIcon-29@2x.png build/ipa/Payload/Snoozy.app/AppIcon29x29@2x.png
          cp -f Snoozy/Resources/Assets.xcassets/AppIcon.appiconset/AppIcon-29@3x.png build/ipa/Payload/Snoozy.app/AppIcon29x29@3x.png
          cp -f Snoozy/Resources/Assets.xcassets/AppIcon.appiconset/AppIcon-20@2x.png build/ipa/Payload/Snoozy.app/AppIcon20x20@2x.png
          cp -f Snoozy/Resources/Assets.xcassets/AppIcon.appiconset/AppIcon-20@3x.png build/ipa/Payload/Snoozy.app/AppIcon20x20@3x.png
          cp -f Snoozy/Resources/Fonts/*.ttf build/ipa/Payload/Snoozy.app/
          echo "=== Verifying Snoozy.app Bundle Contents ==="
          ls -la build/ipa/Payload/Snoozy.app
          test -f build/ipa/Payload/Snoozy.app/AppIcon60x60@2x.png
          test -f build/ipa/Payload/Snoozy.app/SnoozyBrandLogo.png
          test -f build/ipa/Payload/Snoozy.app/bricolage_grotesque_600.ttf
          cd build/ipa
          zip -qry ../Snoozy-iOS-Sideloadly.ipa Payload
          ls -lh ../Snoozy-iOS-Sideloadly.ipa

      - name: Upload Snoozy-iOS-Sideloadly.ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: Snoozy-iOS-Sideloadly-IPA
          path: ios-native/build/Snoozy-iOS-Sideloadly.ipa
          if-no-files-found: error
          retention-days: 90

      - name: Publish Direct Download GitHub Release (v3.4.0)
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.publish_release }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v3.4.0 >/dev/null 2>&1; then
            gh release upload v3.4.0 ios-native/build/Snoozy-iOS-Sideloadly.ipa --clobber
          else
            gh release create v3.4.0 ios-native/build/Snoozy-iOS-Sideloadly.ipa \
              --title "Snoozy v3.4.0 (Sideloadly IPA)" \
              --notes "Unsigned iOS arm64 Sideloadly package for Snoozy v3.4.0 (UI/UX Correction & Interaction Refinement Update)."
          fi
