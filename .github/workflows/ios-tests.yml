name: iOS Unit Tests

on:
  workflow_dispatch:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  test:
    name: Run Snoozy unit tests
    runs-on: macos-26
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi

      - name: Generate Xcode project
        working-directory: ios-native
        run: xcodegen generate

      - name: Select simulator
        run: |
          xcrun simctl list devices available
          UDID=$(xcrun simctl list devices available -j | jq -r '[.devices[][] | select(.name == "iPhone 17")][0].udid')
          if [ -z "$UDID" ] || [ "$UDID" = "null" ]; then
            echo "::error::No iPhone 17 simulator is available on this runner"
            exit 1
          fi
          echo "SIMULATOR_UDID=$UDID" >> "$GITHUB_ENV"

      - name: Run unit tests
        working-directory: ios-native
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild \
            -project Snoozy.xcodeproj \
            -scheme Snoozy \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -derivedDataPath build/TestDerivedData \
            CODE_SIGNING_ALLOWED=NO \
            test 2>&1 | tee build/xcodebuild-test.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "=== XCODEBUILD ERRORS ==="
            grep -E "error:|fatal error:|Testing failed:" build/xcodebuild-test.log | head -n 60 | while IFS= read -r line; do
              echo "::error::$line"
            done
          fi
          exit "$status"
